---
name: Super-Linter

# Run this workflow every time a new commit pushed to your repository
on: push

permissions: {}

jobs:
  super-lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --exclude=SC1071 (unsupported shell): inert while super-linter
          # routes zsh away from shellcheck; kept as insurance because
          # slim@latest floats.
          # -x: inert today, as super-linter's bundled .shellcheckrc (used while
          # .github/linters/ has no .shellcheckrc of its own) already sets
          # external-sources=true; kept as insurance because a repo-local
          # .shellcheckrc would replace that template, and to match check.sh.
          SHELLCHECK_OPTS: "--exclude=SC1071 -x"
          # Exclude: elpa (third-party), .venv (virtual env), and three files
          # shfmt would reformat (mysql-work.sh, .p10k.zsh, .zshrc).
          # Editing this regex has consequences elsewhere: check.sh's
          # SUPER_LINTER_EXCLUDES mirrors it for both the mode and the Python
          # query; biome.json's files.includes repeats its elpa and .venv
          # entries; .github/linters/.jscpd.json's ignore array repeats all its
          # paths.
          FILTER_REGEX_EXCLUDE: .*(emacs/.emacs.d/elpa/|\.venv/|mysql-work/\.zsh\.d/rc/mysql-work\.sh|zsh/\.p10k\.zsh|zsh/\.zshrc).*
          VALIDATE_ANSIBLE: false
          VALIDATE_GIT_COMMITLINT: false
          # Conflicts with black (both are Python formatters)
          VALIDATE_PYTHON_PYINK: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # Redundant with PYTHON_RUFF which covers all flake8 rules
          VALIDATE_PYTHON_FLAKE8: false
