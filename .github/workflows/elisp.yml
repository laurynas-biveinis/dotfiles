---
name: Emacs Lisp

# Run this workflow every time a new commit pushed to your repository
on: push

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the org-autotask submodule
        run: git submodule update --init emacs/.emacs.d/elpa/org-autotask

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: release-snapshot

      - name: Byte-compile tested files
        run: ./compile-elisp.sh

      - name: Run relint
        run: ./relint.sh

      - name: Run ERT tests
        run: ./test-elisp.sh
